<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presupuestos para Electricistas</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <img id="hdrLogo" class="hlogo hidden" alt="Logo">
    <span>Presupuestos</span>
  </div>
  <div class="hbtns">
    <button class="ghost small" id="btnProfile">Mis datos</button>
    <button class="ghost small" id="btnNew">+ Nuevo</button>
  </div>
</header>

<main>
  <div class="col-form">

    <section class="card">
      <h2>Mis datos</h2>
      <div id="profileView" class="hidden">
        <div class="row" style="align-items:flex-start">
          <div id="pvText"></div>
          <img id="pvLogo" class="prev-logo hidden" alt="Logo">
        </div>
        <p class="muted">Quedan guardados en este dispositivo. Solo cambian si los editás.</p>
        <button class="secondary full" id="btnEditP">Editar datos</button>
      </div>

      <form id="profileForm" class="hidden">
        <div class="grid2">
          <div><label for="pNombre">Nombre o razón social *</label><input id="pNombre" required></div>
          <div><label for="pCuil">CUIL</label><input id="pCuil" inputmode="numeric"></div>
          <div><label for="pTel">Teléfono *</label><input id="pTel" type="tel" inputmode="tel" required></div>
          <div><label for="pEmail">Email</label><input id="pEmail" type="email"></div>
          <div><label for="pMat">Matrícula (opcional)</label><input id="pMat"></div>
        </div>
        <label for="pLogo">Logo</label>
        <input id="pLogo" type="file" accept="image/*">
        <div class="row">
          <img id="pLogoPrev" class="prev-logo hidden" alt="Vista previa del logo">
          <button type="button" class="small secondary hidden" id="btnLogoRm">Quitar logo</button>
        </div>
        <div class="row" style="margin-top:14px">
          <button type="button" class="secondary hidden" id="btnCancelP">Cancelar</button>
          <button type="submit" class="primary">Guardar datos</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Datos del cliente</h2>
      <div class="grid2">
        <div><label for="cNombre">Nombre del cliente</label><input id="cNombre" placeholder="Ej: Juan Pérez"></div>
        <div><label for="cTel">Teléfono (WhatsApp) *</label><input id="cTel" type="tel" inputmode="tel" placeholder="Ej: 11 2345-6789 (sin 0 ni 15)"></div>
        <div><label for="cEmail">Email (opcional)</label><input id="cEmail" type="email"></div>
        <div><label for="cDir">Dirección de la obra (opcional)</label><input id="cDir"></div>
      </div>
    </section>

    <section class="card">
      <div class="row" style="margin-bottom:10px"><h2 class="plain" style="margin:0">Ítems</h2><button class="secondary small" id="btnManageShort">Editar atajos</button></div>
      <label style="margin-top:0">Atajos frecuentes (tocá para agregar)</label>
      <div class="chips" id="chips"></div>
      <div id="items"></div>
      <button class="secondary full" id="btnAddItem">+ Agregar ítem manual</button>
      <div class="total-row"><span>Total</span><strong id="total">$ 0,00</strong></div>
    </section>

    <section class="card">
      <h2>Validez y observaciones</h2>
      <label for="validez">Validez del presupuesto</label>
      <select id="validez">
        <option>24 hs</option>
        <option>7 días</option>
        <option>15 días</option>
      </select>
      <label for="obs">Observaciones (opcional)</label>
      <textarea id="obs" placeholder="Ej: 50% de seña, saldo a la entrega. Materiales no incluidos..."></textarea>
    </section>
  </div>

  <div class="col-preview">
    <h2>Vista previa</h2>
    <div class="paper" id="paper"></div>
    <div class="actions">
      <button class="secondary" id="btnPdf">Descargar PDF</button>
      <button class="wa" id="btnWaText">WhatsApp (texto)</button>
      <button class="wa" id="btnWaPdf">WhatsApp + PDF</button>
    </div>
  </div>
</main>

<div id="modalShort" class="modal hidden">
  <div class="sheet">
    <div class="row"><h2 class="plain" style="margin:0">Editar atajos</h2><button class="secondary small" id="closeShort">Cerrar</button></div>
    <p class="muted">Quedan guardados en el dispositivo. Podés cambiar descripción, cantidad y precio.</p>
    <div id="shortList"></div>
    <button class="secondary full" id="addShort">+ Agregar atajo</button>
    <div class="row" style="margin-top:12px">
      <button class="secondary" id="restoreShort">Restaurar originales</button>
      <button class="primary" id="saveShort">Guardar atajos</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="script.js" defer></script>
</body>
</html>
